name: Build and Release Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Static App
        run: npm run build

      - name: Build Electron Windows App
        run: npx electron-builder --win --x64 --publish never

      - name: Rename executable for release
        run: |
          Move-Item -Path "dist/Video To PDF Setup *.exe" -Destination "dist/video-to-pdf-win.exe" -Force
        shell: pwsh

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-to-pdf-win
          path: dist/video-to-pdf-win.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Copy and rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/video-to-pdf.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-to-pdf-android-apk
          path: dist/video-to-pdf.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: video-to-pdf-win
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: video-to-pdf-android-apk
          path: release-assets

      - name: Read Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        run: |
          TAG="v${{ steps.pkg_version.outputs.version }}"
          TITLE="Video To PDF v${{ steps.pkg_version.outputs.version }}"
          
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "Release $TAG"
          fi
          
          gh release delete-asset "$TAG" video-to-pdf-win.exe --yes 2>/dev/null || true
          gh release delete-asset "$TAG" video-to-pdf.apk --yes 2>/dev/null || true

          gh release upload "$TAG" release-assets/video-to-pdf-win.exe release-assets/video-to-pdf.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
